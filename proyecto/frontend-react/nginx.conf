server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Los archivos con hash en el nombre no cambian nunca: el navegador puede guardarlos un año
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Rutas de React Router (/pedidos/5, /login...): no son archivos, así que siempre se entrega index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
