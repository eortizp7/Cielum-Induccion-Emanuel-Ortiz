<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reporte de Usuarios</title>
</head>
<body>
  <h1>Reporte de Usuarios</h1>

  <table border="1" id="tablaReporte">
    <thead>
      <tr>
        <th>Usuario</th>
        <th>Ciudad</th>
        <th>Cantidad de Posts</th>
      </tr>
    </thead>
    <tbody id="cuerpoTabla">
    </tbody>
  </table>

  <script>
    async function cargarReporte() {
      try {
        const [respuestaUsuarios, respuestaPosts] = await Promise.all([
          fetch("https://jsonplaceholder.typicode.com/users"),
          fetch("https://jsonplaceholder.typicode.com/posts"),
        ]);

        const usuarios = await respuestaUsuarios.json();
        const posts = await respuestaPosts.json();

        const cuerpoTabla = document.querySelector("#cuerpoTabla");

        usuarios.forEach((usuario) => {
          const postsDelUsuario = posts.filter((post) => post.userId === usuario.id);

          const fila = document.createElement("tr");
          fila.innerHTML = `
            <td>${usuario.name}</td>
            <td>${usuario.address.city}</td>
            <td>${postsDelUsuario.length}</td>
          `;

          cuerpoTabla.appendChild(fila);
        });
      } catch (error) {
        console.log("Error al cargar el reporte:", error.message);
      }
    }

    cargarReporte();
  </script>
</body>
</html>
